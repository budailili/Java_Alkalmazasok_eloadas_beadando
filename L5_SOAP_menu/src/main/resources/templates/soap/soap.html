<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('SOAP – MNB árfolyamok')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main>
    <div class="container">
        <div class="page-title">
            <h1>MNB árfolyamok</h1>
            <p>Hivatalos MNB középárfolyamok lekérdezése SOAP webszolgáltatással.</p>
        </div>

        <div class="panel">
            <form th:action="@{/soap}" th:object="${form}" method="post" class="row g-3 align-items-end">
                <div class="col-md-3">
                    <label for="currency" class="form-label">Deviza</label>
                    <select id="currency" class="form-select" th:field="*{currency}">
                        <option th:each="c : ${currencies}" th:value="${c}" th:text="${c}">EUR</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label for="startDate" class="form-label">Kezdő dátum</label>
                    <input id="startDate" type="date" class="form-control" th:field="*{startDate}"
                           th:max="${today}" required>
                </div>
                <div class="col-md-3">
                    <label for="endDate" class="form-label">Befejező dátum</label>
                    <input id="endDate" type="date" class="form-control" th:field="*{endDate}"
                           th:max="${today}" required>
                </div>
                <div class="col-md-3 d-grid">
                    <button type="submit" class="btn btn-primary">Árfolyamok lekérése</button>
                </div>
            </form>
        </div>

        <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

        <th:block th:if="${rates}">
            <div class="panel">
                <h2 class="h5 mb-3"
                    th:text="${form.currency} + ' árfolyam (' + ${unit} + ' ' + ${form.currency} + ' = ? HUF), '
                             + ${form.startDate} + ' – ' + ${form.endDate}"></h2>
                <div class="rate-strip mb-4">
                    <div><small>Minimum</small><strong th:text="${#numbers.formatDecimal(min, 1, 'WHITESPACE', 2, 'COMMA')}"></strong></div>
                    <div><small>Maximum</small><strong th:text="${#numbers.formatDecimal(max, 1, 'WHITESPACE', 2, 'COMMA')}"></strong></div>
                    <div><small>Átlag</small><strong th:text="${#numbers.formatDecimal(avg, 1, 'WHITESPACE', 2, 'COMMA')}"></strong></div>
                    <div><small>Napok száma</small><strong th:text="${rates.size()}"></strong></div>
                </div>
                <div class="chart-box">
                    <canvas id="rateChart" aria-label="Árfolyam grafikon" role="img"></canvas>
                </div>
            </div>

            <div class="panel">
                <h2 class="h5 mb-3">Napi árfolyamok</h2>
                <div class="table-responsive">
                    <table class="table table-striped table-hover mb-0">
                        <thead>
                        <tr>
                            <th>Dátum</th>
                            <th class="num">Egység</th>
                            <th class="num">Árfolyam (HUF)</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="r : ${rates}">
                            <td th:text="${r.date}"></td>
                            <td class="num" th:text="${r.unit} + ' ' + ${form.currency}"></td>
                            <td class="num" th:text="${#numbers.formatDecimal(r.value, 1, 'WHITESPACE', 2, 'COMMA')}"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </th:block>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

<th:block th:if="${rates}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script th:inline="javascript">
        const labels = /*[[${labels}]]*/ [];
        const values = /*[[${values}]]*/ [];
        const currency = /*[[${form.currency}]]*/ 'EUR';
        const unit = /*[[${unit}]]*/ 1;

        new Chart(document.getElementById('rateChart'), {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: unit + ' ' + currency + ' (HUF)',
                    data: values,
                    borderColor: '#18bc9c',
                    backgroundColor: 'rgba(24, 188, 156, 0.12)',
                    fill: true,
                    tension: 0.25,
                    pointRadius: values.length > 60 ? 0 : 3
                }]
            },
            options: {
                maintainAspectRatio: false,
                interaction: { mode: 'index', intersect: false },
                scales: {
                    y: { title: { display: true, text: 'HUF' } }
                }
            }
        });
    </script>
</th:block>
</body>
</html>
