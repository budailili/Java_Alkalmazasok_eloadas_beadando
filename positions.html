<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Forex-Poz')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main>
    <div class="container">
        <div class="page-title">
            <h1>Nyitott pozíciók</h1>
            <p>A számlán jelenleg nyitott trade-ek.</p>
        </div>

        <div th:replace="~{fragments/layout :: oandaMissing}"></div>
        <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

        <div class="panel" th:if="${trades != null}">
            <p class="text-muted" th:if="${trades.isEmpty()}">
                Nincs nyitott pozíció. Nyitni a <a th:href="@{/forex/open}">Forex-Nyit</a> menüben lehet.
            </p>
            <div class="table-responsive" th:unless="${trades.isEmpty()}">
                <table class="table table-striped table-hover mb-0">
                    <thead>
                    <tr>
                        <th>tradeId</th>
                        <th>Instrumentum</th>
                        <th>Nyitás ideje (UTC)</th>
                        <th>Irány</th>
                        <th class="num">Mennyiség</th>
                        <th class="num">Nyitóár</th>
                        <th class="num">Nem realizált P/L</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="t : ${trades}">
                        <td class="fw-bold" th:text="${t.id}"></td>
                        <td th:text="${t.instrument}"></td>
                        <td th:text="${#strings.replace(#strings.substring(t.openTime.toString(), 0, 19), 'T', ' ')}"></td>
                        <td th:text="${t.currentUnits.doubleValue() > 0} ? 'Long' : 'Short'"></td>
                        <td class="num" th:text="${t.currentUnits}"></td>
                        <td class="num" th:text="${t.price}"></td>
                        <td class="num" th:text="${t.unrealizedPL}"
                            th:classappend="${t.unrealizedPL.doubleValue() >= 0} ? 'positive' : 'negative'"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
